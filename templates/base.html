<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Flask{% endblock %}</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        background: #f4f4f4;
        color: #222;
      }
      header {
        background: #2c3e50;
        padding: 16px 24px;
      }
      header nav a {
        color: #fff;
        text-decoration: none;
        margin-right: 16px;
        font-weight: bold;
      }
      header nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 720px;
        margin: 32px auto;
        background: #fff;
        padding: 24px 32px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Início</a>
        <a href="/sobre">Sobre</a>
        <a href="/info">Info</a>
      </nav>
    </header>
    <main>
      {% block conteudo %}{% endblock %}
    </main>
  </body>
</html>
